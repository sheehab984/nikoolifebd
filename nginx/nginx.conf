events {
  worker_connections 1024;
}

http {
  # ── Block direct IP access (Docker bypasses UFW, so enforce in nginx) ─────
  # Only Cloudflare proxy IPs are allowed to connect. Direct hits to
  # 72.61.147.202 get a connection close with no response (444).
  # $realip_remote_addr = original TCP connection IP (Cloudflare edge).
  # $remote_addr is already rewritten to the visitor's real IP by set_real_ip_from,
  # so we must check the pre-rewrite address here.
  geo $realip_remote_addr $is_cloudflare {
    default 0;
    # IPv4 — https://www.cloudflare.com/ips-v4
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22   1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15  1;
    104.16.0.0/13   1;
    104.24.0.0/14   1;
    172.64.0.0/13   1;
    131.0.72.0/22   1;
    # IPv6 — https://www.cloudflare.com/ips-v6
    2400:cb00::/32  1;
    2606:4700::/32  1;
    2803:f800::/32  1;
    2405:b500::/32  1;
    2405:8100::/32  1;
    2a06:98c0::/29  1;
    2c0f:f248::/32  1;
  }

  # ── Cloudflare real IP ────────────────────────────────────────────────────
  # Replace $remote_addr with the actual visitor IP from CF-Connecting-IP.
  # Without this, rate limiting and logs show Cloudflare's IPs, not users'.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # ── Gzip ──────────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 256;

  # ── Rate limiting (keyed on real visitor IP after CF passthrough) ─────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=store:10m rate=60r/m;

  # ── Upstreams ─────────────────────────────────────────────────────────────
  upstream backend {
    server backend:9000;
  }

  upstream storefront {
    server storefront:8000;
  }

  # ── Shared SSL config (Cloudflare origin wildcard cert) ───────────────────
  ssl_certificate     /etc/nginx/certs/origin.crt;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
  server {
    listen 80;
    server_name nikoolife.co.uk www.nikoolife.co.uk api.nikoolife.co.uk;
    if ($is_cloudflare = 0) { return 444; }
    return 301 https://$host$request_uri;
  }

  # ── Storefront — nikoolife.co.uk ──────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name nikoolife.co.uk www.nikoolife.co.uk;

    client_max_body_size 10M;

    if ($is_cloudflare = 0) { return 444; }

    # Prevent clickjacking, MIME sniffing, and information leakage
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      limit_req zone=store burst=20 nodelay;
      proxy_pass http://storefront;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets — immutable cache
    location /_next/static/ {
      proxy_pass http://storefront;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }

  # ── Backend API — api.nikoolife.co.uk ─────────────────────────────────────
  server {
    listen 443 ssl;
    server_name api.nikoolife.co.uk;

    client_max_body_size 50M;

    if ($is_cloudflare = 0) { return 444; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Deny embedding the API in iframes entirely
    add_header X-Frame-Options "DENY" always;

    # Admin UI and its static assets — no rate limit (browser loads many chunks)
    location /app {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded product images — served directly by nginx from Docker volume.
    # Bypasses backend and rate limiter; immutable cache since filenames are unique.
    location /uploads/ {
      alias /uploads/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
