events {
  worker_connections 1024;
}

http {
  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 256;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=store:10m rate=60r/m;

  upstream backend {
    server backend:9000;
  }

  upstream storefront {
    server storefront:8000;
  }

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name nikoolife.co.uk www.nikoolife.co.uk api.nikoolife.co.uk;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Storefront — nikoolife.co.uk
  server {
    listen 443 ssl;
    server_name nikoolife.co.uk www.nikoolife.co.uk;

    ssl_certificate /etc/nginx/certs/nikoolife.co.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nikoolife.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location / {
      limit_req zone=store burst=20 nodelay;
      proxy_pass http://storefront;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets — no rate limiting needed
    location /_next/static/ {
      proxy_pass http://storefront;
      proxy_cache_valid 200 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # Backend API — api.nikoolife.co.uk
  server {
    listen 443 ssl;
    server_name api.nikoolife.co.uk;

    ssl_certificate /etc/nginx/certs/api.nikoolife.co.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.nikoolife.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
