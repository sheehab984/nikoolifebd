events {
  worker_connections 1024;
}

http {
  # HTTP-only config used once during initial SSL certificate generation via Certbot.
  # After certs are issued, switch to nginx.conf and restart nginx.

  upstream backend {
    server backend:9000;
  }

  upstream storefront {
    server storefront:8000;
  }

  server {
    listen 80;
    server_name nikoolife.co.uk www.nikoolife.co.uk api.nikoolife.co.uk;

    # Certbot ACME challenge — must be served over plain HTTP
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Serve traffic during bootstrap (no redirect yet)
    location / {
      proxy_pass http://storefront;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
